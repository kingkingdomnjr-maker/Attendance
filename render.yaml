services:
  - type: web
    name: attendance-admin
    env: node
    rootDir: .
    plan: free
    buildCommand: npm ci --include=dev && npm ci --prefix backend && npm run build
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
